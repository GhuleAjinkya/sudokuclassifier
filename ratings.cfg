weight.Hidden Triple = 2
weight.Jellyfish = 25
weight.Naked Pair = 1
weight.Naked Quad = 2.5
weight.Naked Single = 0.01
weight.Naked Triple = 1.5
weight.Pointing Pair/Triple (Box -> Line) = 1
weight.Simple Coloring = 18
weight.Skyscraper = 15
weight.Swordfish = 20
weight.X-Wing = 15
weight.XY-Wing = 16
weight.XYZ-Wing = 17

# --- Tier 4 (guessing) penalty ---
search.base = 40
search.perDepth = 5

# --- difficulty bands (on the weighted score) ---
difficulty.medium = 1.2
difficulty.high = 14

# --- length bands (logic steps + cells filled by search) ---
length.medium = 56
length.long = 58

# --- complexity bands (technique probes + search assignments) ---
