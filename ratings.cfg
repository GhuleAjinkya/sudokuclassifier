# Rating configuration. Lines are 'key = value'; '#' starts a comment.
# Difficulty score = sum(weight x steps per technique) + search penalty.
# A value below the 'medium' threshold rates Low/Short, below 'high'/'long' rates Medium, else High/Long.

# --- technique weights (points per logic step) ---
